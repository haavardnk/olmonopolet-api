[project]
name = "beermonopoly-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cloudscraper25>=2.7.0",
    "curl-cffi>=0.16.0",
    "django-admin-shell>=2.0.1",
    "django-cors-headers>=4.9.0",
    "django-dirtyfields>=1.9.9",
    "django-extensions>=4.1",
    "django-filter>=26.1",
    "django-hosts>=7.0",
    "django-q2>=1.10.0",
    "django>=6.0,<6.1",
    "djangorestframework-api-key>=3.1.0",
    "djangorestframework>=3.17.1",
    "drf-dynamic-fields>=0.4.0",
    "factory-boy>=3.3.3",
    "feedparser>=6.0.14",
    "firebase-admin>=7.5.0",
    "fuzzywuzzy>=0.18.0",
    "gunicorn>=26.0.0",
    "jupyter>=1.1.1",
    "psycopg-binary>=3.3.4",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "pytest-django>=4.12.0",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "responses>=0.26.2",
    "ruff>=0.16.1",
    "sentry-sdk>=2.66.1",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyrefly]
search_path = ["src"]

[[tool.pyrefly.sub-config]]
matches = "src/beers/api/serializers/**"
[tool.pyrefly.sub-config.errors]
bad-override = false

[[tool.pyrefly.sub-config]]
matches = "src/beers/tests/factories.py"
[tool.pyrefly.sub-config.errors]
bad-override = false

[[tool.pyrefly.sub-config]]
matches = "src/beers/tests/**"
[tool.pyrefly.sub-config.errors]
bad-assignment = false
bad-argument-type = false
bad-argument-count = false
bad-return = false

[dependency-groups]
dev = [
    "coverage>=7.15.3",
    "django-filter-stubs>=0.1.3",
    "django-stubs>=6.0.7",
    "djangorestframework-stubs>=3.17.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "types-firebase-admin>=0.1.1",
    "types-requests>=2.33.0",
]
